    - Bumped to v3.2.2
  * Mon Mar  5 2018 - Mark J. Titorenko <mark.titorenko@alces-software.com>
    - Bumped to v2.2.3
  * Sun May 15 2016 - Ruan G. Ellis <ruan.ellis@alces-software.com>
    - Bumped to v2.1.0
