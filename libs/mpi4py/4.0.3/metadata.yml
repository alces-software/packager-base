---
:schema: 1
:license: BSD
:summary: Python bindings for the Message Passing Interface (MPI)
:url: https://mpi4py.github.io/mpi4py/stable/
:description: |
  MPI for Python (mpi4py) provides bindings of the Message Passing
  Interface (MPI) standard for the Python programming language,
  allowing any Python program to exploit multiple processors.

  This package is constructed on top of the MPI-1/MPI-2 specification
  and provides an object oriented interface which closely follows
  MPI-2 C++ bindings. It supports point-to-point (sends, receives) and
  collective (broadcasts, scatters, gathers) communications of any
  picklable Python object as well as optimized communications of
  Python object exposing the single-segment buffer interface (NumPy
  arrays, builtin bytes/string/array objects).
:type: libs
:group: Libraries
:changelog: |
  * Mon Mar 10 2025 - Rob Brown <rob.brown@alces-flight.com>
    - Updated to v4.0.3
  * Mon Aug 17 2020 - Rob Brown <rob.brown@alces-flight.com>
    - Updated to v3.0.3
  * Wed Mar 21 2018 - Mark J. Titorenko <mark.titorenko@alces-software.com>
    - Updated source URL
  * Mon Jul  8 2013 - James Donohue <james.donohue@alces-software.com>
    - First created
:src: mpi4py-4.0.3.tar.gz
:version: '4.0.3'
:compilers:
  gcc:
:requirements:
  :build: 
    - apps/python3 >= 3.6.0
    - mpi/openmpi
  :runtime: 
    - apps/python3 >= 3.6.0
    - mpi/openmpi
:compile: |
  export PYTHONDONTWRITEBYTECODE=true
  python3 setup.py build <%= redirect(:build) %>
:install: |
  export PYTHONDONTWRITEBYTECODE=true
  python3 setup.py install --prefix <%= dest_dir %>/python <%= redirect(:install) %>
:module: |
  setenv ${appcaps}DIR ${appdir}
  setenv ${appcaps}BIN ${appdir}/python/bin

  prepend-path PATH ${appdir}/python/bin

  prepend-path PYTHONPATH ${appdir}/python/lib/<%=
    File.basename(Dir.glob(File.join(dest_dir, 'python', 'lib', 'python3.*')).first)
  %>/site-packages
